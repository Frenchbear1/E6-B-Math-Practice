<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>E6-B Trainer — Flight Computer Practice</title>
  <meta name="description" content="Randomized, realistic E6-B and CX-3 flight computer practice for GA, airline and military pilots: wind triangles, fuel, density altitude, Mach, holds, W&B, ETP/PNR and more." />
  <meta name="theme-color" content="#0b1118" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%230b1118' stroke='%23ffb020' stroke-width='5'/%3E%3Cpath d='M32 10v8M32 46v8M10 32h8M46 32h8' stroke='%23ffb020' stroke-width='4'/%3E%3Cpath d='M32 32 L44 20' stroke='%233fd0ff' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 64 64" class="logo" aria-hidden="true"><circle cx="32" cy="32" r="28" /><path class="tick" d="M32 8v8M32 48v8M8 32h8M48 32h8" /><path class="hand" d="M32 32 L45 19" /><circle cx="32" cy="32" r="4" class="hub" /></svg>
      <div>
        <div class="brand-name">E6·B <span>Trainer</span></div>
        <div class="brand-sub">Flight computer practice · E6-B &amp; CX-3</div>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button data-view="practice" class="on">Practice</button>
      <button data-view="tools">Tools</button>
      <button data-view="stats">Stats</button>
      <button data-view="ref">Reference</button>
    </nav>
  </header>

  <main>
    <section id="view-practice" class="view on"></section>
    <section id="view-tools" class="view"></section>
    <section id="view-stats" class="view"></section>
    <section id="view-ref" class="view"></section>
  </main>

  <button id="calcFab" class="fab" hidden aria-label="Scratch calculator">
    <svg viewBox="0 0 24 24"><rect x="4" y="2.5" width="16" height="19" rx="2.5" /><rect x="7" y="5.5" width="10" height="4" rx="1" /><path d="M8 13h.01M12 13h.01M16 13h.01M8 17h.01M12 17h.01M16 17h.01" /></svg>
  </button>
  <div id="calc" class="calc" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <footer class="foot">
    For training and practice only — not for flight planning. Aircraft numbers are representative approximations; always use your AFM/POH, current charts and FAA guidance.
  </footer>

  <script src="js/util.js"></script>
  <script src="js/aviation.js"></script>
  <script src="js/profiles.js"></script>
  <script src="js/problems.js"></script>
  <script src="js/diagram.js"></script>
  <script src="js/tools.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
